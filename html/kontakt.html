<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Atlantic Yachts – persönliche Beratung und vier ausgewählte Motoryachten. Ein fiktives Schulprojekt." />

    <title>Kontakt | Atlantic Yachts</title>
    <link rel="icon" type="image/png" href="../images/atlantic.yachts.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#inhalt">Zum Inhalt</a>
    <header class="site-header navbar navbar-dark">
      <div class="container">
        <div class="brand d-flex align-items-center">
          <img src="../images/atlantic.yachts.png" width="797" height="633" alt="Atlantic Yachts Logo mit türkisfarbenen und violetten Wellen" />
          <span>Atlantic Yachts</span>
        </div>
        <button id="menu-button" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-label="Menü" aria-expanded="false" aria-controls="navigation"><span class="navbar-toggler-icon"></span></button>
        <nav id="navigation" class="collapse navbar-collapse" aria-label="Hauptnavigation">
          <div class="navbar-nav pt-3">
            <a class="nav-link" href="index.html">Startseite</a>
            <a class="nav-link" href="yachten.html">Yachten</a>
            <a class="nav-link" href="service.html">Service</a>
            <a class="nav-link" href="ueber-uns.html">Über uns</a>
            <a class="nav-link active" href="kontakt.html" aria-current="page">Kontakt</a>
          </div>
        </nav>
      </div>
    </header>
    <main id="inhalt" class="container py-4">
      <h1 class="mb-4">Kontakt</h1>
      <div class="row g-4">
        <section class="col-12 col-md-5" aria-labelledby="zeiten">
          <div class="contact-box">
            <h2 id="zeiten">Öffnungszeiten</h2>
            <dl class="mb-0">
              <dt>Montag bis Freitag</dt>
              <dd class="mb-3">09:00–17:00 Uhr</dd>
              <dt>Samstag und Sonntag</dt>
              <dd>Geschlossen</dd>
            </dl>
          </div>
        </section>
        <section class="col-12 col-md-7" aria-labelledby="formular">
          <div class="contact-box">
            <h2 id="formular">Kontaktformular</h2>
            <form id="contact-form">
              <label class="form-label" for="name">Name</label> <input class="form-control mb-3" id="name" name="name" autocomplete="name" required maxlength="100" />
              <label class="form-label" for="email">E-Mail</label> <input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" required maxlength="254" />
              <label class="form-label" for="message">Nachricht</label>
              <textarea class="form-control mb-3" id="message" name="message" rows="5" required maxlength="3000"></textarea>
              <button class="btn btn-dark rounded-0" type="submit">Absenden</button>
            </form>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
